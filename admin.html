<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F3FF;--surface:#fff;--ink:#241748;--ink-soft:#6C63A6;--primary:#7C4DFF;--primary-deep:#5B32D6;--yellow:#FFC93C;--green:#149E77;--red:#D6336C;--orange:#B87A00;--border:#E7E0FF;--shadow:0 10px 30px rgba(124,77,255,.10)}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Cairo,sans-serif;background:radial-gradient(circle at 15% 10%,#EFE9FF 0%,transparent 40%),radial-gradient(circle at 90% 0%,#FFF2D9 0%,transparent 35%),var(--bg);color:var(--ink);min-height:100vh}h1,h2,h3{font-family:Lalezar,Cairo,sans-serif}.wrap{max-width:1250px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:18px 22px;box-shadow:var(--shadow);margin-bottom:20px}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:55px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,var(--primary),var(--primary-deep));color:#fff;clip-path:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0 50%);font-size:22px;font-weight:900}.brand h1{font-size:25px}.brand p{font-size:11px;color:var(--ink-soft)}.top-actions{display:flex;gap:9px}.btn{border:0;border-radius:13px;padding:10px 16px;font:800 12px Cairo;cursor:pointer}.btn.secondary{background:#F2EEFF;color:var(--primary-deep)}.btn.primary{background:linear-gradient(145deg,var(--primary),var(--primary-deep));color:#fff}.btn.green{background:#E8FAF2;color:var(--green)}.btn.red{background:#FFF0F4;color:var(--red)}.toolbar{display:grid;grid-template-columns:1fr 180px 150px;gap:12px;margin-bottom:16px}.field{background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:11px 13px;font:700 12px Cairo;color:var(--ink);outline:none;width:100%}.panel{background:var(--surface);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}.panel-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}.panel-head h2{font-size:21px}.count{font-size:11px;font-weight:900;background:#F2EEFF;color:var(--primary-deep);padding:6px 10px;border-radius:999px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:950px}th,td{padding:13px 12px;text-align:right;border-bottom:1px solid #F0ECFA;font-size:11.5px;vertical-align:middle}th{font-weight:900;color:var(--ink-soft);background:#FBFAFF}td{font-weight:600}.user{font-weight:900;font-size:12px}.sub{font-size:10px;color:var(--ink-soft);direction:ltr;text-align:right;margin-top:2px}.status{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:10px;font-weight:900}.pending{background:#FFF7DD;color:var(--orange)}.approved{background:#E8FAF2;color:var(--green)}.rejected{background:#FFF0F4;color:var(--red)}.actions{display:flex;gap:6px;flex-wrap:wrap}.empty,.loading,.denied{padding:55px 20px;text-align:center;color:var(--ink-soft)}.empty h3,.loading h3,.denied h3{font-size:22px;color:var(--ink);margin-bottom:7px}.modal-overlay{position:fixed;inset:0;background:rgba(30,20,55,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:100}.modal-overlay.show{display:flex}.modal{width:min(850px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:26px;box-shadow:0 30px 80px rgba(20,10,50,.3)}.modal-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#F2EEFF;color:var(--primary-deep);width:38px;height:38px;border-radius:12px;cursor:pointer;font-weight:900}.details{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:14px}.detail{background:#FAF8FF;border:1px solid var(--border);border-radius:15px;padding:12px}.detail label{display:block;color:var(--ink-soft);font-size:10px;font-weight:800;margin-bottom:4px}.detail div{font-size:13px;font-weight:900;word-break:break-word}.proof{grid-column:1/-1;text-align:center}.proof img{max-width:100%;max-height:480px;object-fit:contain;border-radius:16px;border:1px solid var(--border);background:#FAF8FF}.notes{grid-column:1/-1}.notes textarea{min-height:100px;resize:vertical}.modal-actions{padding:0 20px 20px;display:flex;gap:10px}.modal-actions .btn{flex:1}.notice{margin:0 20px 18px;padding:12px 14px;border-radius:14px;font-size:11px;font-weight:700;line-height:1.7}.notice.info{background:#F2EEFF;color:var(--primary-deep)}.notice.err{background:#FFF0F4;color:var(--red)}.badge-admin-grid{display:grid;grid-template-columns:1fr 1fr 160px;gap:10px;padding:18px 20px}.badge-admin-card{border-top:1px solid var(--border);padding:15px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}.badge-admin-card .mini{display:flex;align-items:center;gap:10px}.badge-admin-icon{width:42px;height:48px;display:flex;align-items:center;justify-content:center;background:#FFF1CC;font-size:22px;clip-path:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0 50%)}@media(max-width:760px){.badge-admin-grid{grid-template-columns:1fr}.badge-admin-card{align-items:flex-start;flex-direction:column}}@media(max-width:760px){.wrap{padding:12px}.top{padding:15px;border-radius:19px;align-items:flex-start}.brand h1{font-size:21px}.top-actions{flex-direction:column}.toolbar{grid-template-columns:1fr}.details{grid-template-columns:1fr}.proof,.notes{grid-column:auto}.modal-actions{flex-direction:column}}

.season-admin{padding:18px 20px}.season-admin-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px;margin-bottom:10px}.season-player-grid{display:grid;grid-template-columns:1fr 150px 150px 1fr;gap:10px}.season-help{font-size:10px;color:var(--ink-soft);line-height:1.7;margin-top:6px}.danger-note{background:#FFF7F8;border:1px solid #FFD8E2;color:#A9274F;padding:10px 12px;border-radius:12px;font-size:10px;margin:12px 20px 0}@media(max-width:760px){.season-admin-grid,.season-player-grid{grid-template-columns:1fr}}

<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><div class="logo">R</div><div><h1>لوحة الإدارة</h1><p>Rmd Null — إدارة طلبات التوثيق</p></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://xymxdprcbgdgedrzoryo.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Fyk5kX_1zrd_0Oqg0pMVGw_hL2rWx_G";
const VERIFY_BUCKET = "verification-docs";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentUser=null, requests=[], playersByUser={}, selectedRequest=null;
const esc=s=>(s??"").toString().replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function isAdmin(user){return !!(user?.app_metadata?.role === "admin");}
function statusLabel(s){return s==='approved'?'موثق':s==='rejected'?'مرفوض':'قيد المراجعة'}
function statusClass(s){return s==='approved'?'approved':s==='rejected'?'rejected':'pending'}
function fmtDate(v){if(!v)return '—';try{return new Intl.DateTimeFormat('ar',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v))}catch{return v}}
function renderShell(){document.getElementById('pageState').innerHTML=`<div class="toolbar"><input class="field" id="search" placeholder="ابحث باسم اللاعب أو Player Tag أو اليوزر الاجتماعي..."><select class="field" id="statusFilter"><option value="all">كل الطلبات</option><option value="pending">قيد المراجعة</option><option value="approved">موثق</option><option value="rejected">مرفوض</option></select><select class="field" id="sortOrder"><option value="desc">الأحدث أولاً</option><option value="asc">الأقدم أولاً</option></select></div><section class="panel"><div class="panel-head"><h2>طلبات التوثيق</h2><span class="count" id="count">0</span></div><div id="tableArea"></div></section><section class="panel" style="margin-top:18px"><div class="panel-head"><h2>إدارة الشارات والألقاب</h2><span class="count">منح الإنجازات</span></div><div class="badge-admin-grid"><input class="field" id="badgePlayerSearch" placeholder="ابحث باسم اللاعب..."><select class="field" id="badgePlayerSelect"><option value="">اختر اللاعب</option></select><select class="field" id="badgeSelect"><option value="">اختر الشارة</option></select></div><div style="padding:0 20px 18px"><button class="btn primary" id="awardBadgeBtn" style="width:100%">🏅 منح الشارة وإضافة اللقب</button><div id="badgeAdminMsg" class="notice" style="display:none;margin:12px 0 0"></div></div><div id="badgeAwardsArea"></div></section><section class="panel" style="margin-top:18px"><div class="panel-head"><h2>🧪 لاعبين تجريبيين</h2><span class="count">للاختبار فقط</span></div><div class="badge-admin-grid" style="grid-template-columns:1fr 150px 150px"><input class="field" id="testPlayerName" placeholder="اسم اللاعب التجريبي"><input class="field" id="testPlayerTrophies" type="number" min="0" placeholder="الكؤوس"><input class="field" id="testPlayerWins" type="number" min="0" placeholder="الانتصارات"></div><div class="badge-admin-grid" style="grid-template-columns:1fr 1fr 1fr"><input class="field" id="testPlayerTag" placeholder="Player Tag مثل #TEST01"><input class="field" id="testPlayerSocial" placeholder="اليوزر الاجتماعي"><input class="field" id="testPlayerBest" type="number" min="0" placeholder="أعلى كؤوس"></div><div style="padding:0 20px 18px"><button class="btn primary" id="createTestPlayerBtn" style="width:100%">➕ إنشاء لاعب تجريبي</button><div id="testPlayerMsg" class="notice" style="display:none;margin:12px 0 0"></div></div><div id="testPlayersArea"></div></section><section class="panel" style="margin-top:18px"><div class="panel-head"><h2>🗑️ إدارة اللاعبين</h2><span class="count">حذف لاعب</span></div><div class="season-admin"><input class="field" id="deletePlayerSearch" placeholder="ابحث عن لاعب لحذفه..." style="margin-bottom:10px"><div id="deletePlayersArea"></div></div><div class="danger-note">الحذف يزيل سجل اللاعب من الموقع وبيانات الشارات والطلبات وإحصائيات الموسم. لا يتم حذف حساب Supabase Auth نفسه.</div></section><section class="panel" style="margin-top:18px"><div class="panel-head"><h2>🏅 إدارة الموسم الحالي</h2><span class="count">Admin فقط</span></div><div class="season-admin"><div class="season-admin-grid"><input class="field" id="seasonNameInput" placeholder="اسم الموسم"><input class="field" id="seasonStartInput" type="datetime-local"><input class="field" id="seasonEndInput" type="datetime-local"></div><button class="btn primary" id="saveSeasonBtn" style="width:100%">💾 حفظ إعدادات الموسم</button><div id="seasonAdminMsg" class="notice" style="display:none;margin:12px 0 0"></div><div class="season-help">مدة الموسم الافتراضية 13 يومًا. يمكنك تغيير تاريخ البداية والنهاية من هنا.</div><hr style="border:0;border-top:1px solid var(--border);margin:18px 0"><div class="season-player-grid"><input class="field" id="seasonPlayerSearch" placeholder="ابحث عن لاعب..."><input class="field" id="seasonPlayerGain" type="number" min="0" placeholder="الكؤوس المرفوعة هذا الموسم"><input class="field" id="seasonPlayerRank" type="number" min="0" placeholder="الرتبة التي رفعها"><input class="field" id="seasonPlayerAchievements" placeholder="الإنجازات — افصل بينها بفاصلة"></div><select class="field" id="seasonPlayerSelect" style="margin-top:10px"><option value="">اختر اللاعب</option></select><button class="btn primary" id="saveSeasonPlayerBtn" style="width:100%;margin-top:10px">📊 حفظ إحصائيات اللاعب</button><div id="seasonPlayerMsg" class="notice" style="display:none;margin:12px 0 0"></div></div><div id="seasonAdminPlayersArea"></div></section>`;document.getElementById('search').oninput=renderTable;document.getElementById('statusFilter').onchange=renderTable;document.getElementById('sortOrder').onchange=renderTable;}
async function load(){
  const {data:userData,error:userErr}=await sb.auth.getUser();
  if(userErr||!userData.user){deny('يجب تسجيل الدخول أولاً بحساب المشرف.');return;}
  currentUser=userData.user;
  if(!isAdmin(currentUser)){deny('هذا الحساب لا يملك صلاحية المشرف.');return;}
  renderShell();
  await loadRequests();
  await loadBadgeManager();
}
function deny(msg){document.getElementById('pageState').innerHTML=`<div class="denied"><div style="font-size:42px;margin-bottom:8px">🔒</div><h3>غير مصرح</h3><p>${esc(msg)}</p><button class="btn primary" style="margin-top:15px" onclick="location.href='index.html'">العودة للموقع</button></div>`}
let badgeDefs=[], verifiedPlayers=[];
async function loadBadgeManager(){
  const b=await sb.from('badges').select('id,name,icon,title').order('name');
  if(b.error){console.warn(b.error);return;}
  badgeDefs=b.data||[];
  const p=await sb.from('players').select('user_id,username,trophies,wins,verified,is_test_player,clan,player_tag,social_username,best_trophies').order('username');
  if(p.error){console.warn(p.error);return;}
  verifiedPlayers=p.data||[];
  const ps=document.getElementById('badgePlayerSelect'), bs=document.getElementById('badgeSelect');
  if(ps) ps.innerHTML='<option value="">اختر اللاعب</option>'+verifiedPlayers.map(x=>`<option value="${esc(x.user_id)}">${esc(x.username)} — ${Number(x.trophies||0).toLocaleString('en-US')} 🏆</option>`).join('');
  if(bs) bs.innerHTML='<option value="">اختر الشارة</option>'+badgeDefs.map(x=>`<option value="${esc(x.id)}">${esc(x.icon)} ${esc(x.name)} — لقب: ${esc(x.title)}</option>`).join('');
  const search=document.getElementById('badgePlayerSearch');
  if(search) search.oninput=()=>{const q=search.value.trim().toLowerCase();const filtered=verifiedPlayers.filter(x=>String(x.username||'').toLowerCase().includes(q));ps.innerHTML='<option value="">اختر اللاعب</option>'+filtered.map(x=>`<option value="${esc(x.user_id)}">${esc(x.username)} — ${Number(x.trophies||0).toLocaleString('en-US')} 🏆</option>`).join('');};
  document.getElementById('awardBadgeBtn').onclick=awardBadge;
  document.getElementById('createTestPlayerBtn').onclick=createTestPlayer;
  renderTestPlayers();
  setupPlayerDelete();
  await loadSeasonAdmin();
}

async function createTestPlayer(){
  const msg=document.getElementById('testPlayerMsg');
  const username=document.getElementById('testPlayerName').value.trim();
  const trophies=Number(document.getElementById('testPlayerTrophies').value||0);
  const wins=Number(document.getElementById('testPlayerWins').value||0);
  const playerTag=document.getElementById('testPlayerTag').value.trim();
  const socialUsername=document.getElementById('testPlayerSocial').value.trim();
  const bestTrophies=Number(document.getElementById('testPlayerBest').value||trophies);
  if(!username){msg.textContent='اكتب اسم اللاعب التجريبي أولاً.';msg.className='notice err';msg.style.display='block';return;}
  if(wins<0||trophies<0||bestTrophies<0){msg.textContent='الأرقام يجب ألا تكون سالبة.';msg.className='notice err';msg.style.display='block';return;}
  const {error}=await sb.rpc('admin_create_test_player',{p_username:username,p_trophies:trophies,p_wins:wins,p_player_tag:playerTag||null,p_social_username:socialUsername||null,p_best_trophies:bestTrophies});
  if(error){msg.textContent='تعذر إنشاء اللاعب التجريبي: '+error.message;msg.className='notice err';msg.style.display='block';return;}
  msg.textContent='تم إنشاء اللاعب التجريبي بنجاح.';msg.className='notice info';msg.style.display='block';
  ['testPlayerName','testPlayerTrophies','testPlayerWins','testPlayerTag','testPlayerSocial','testPlayerBest'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  await loadBadgeManager();
  renderTestPlayers();
}

function renderTestPlayers(){
  const area=document.getElementById('testPlayersArea'); if(!area)return;
  const tests=verifiedPlayers.filter(p=>p.is_test_player===true);
  area.innerHTML=tests.length ? `<div style="padding:0 20px 18px"><div class="table-wrap"><table style="min-width:760px"><thead><tr><th>اللاعب</th><th>الكؤوس</th><th>الانتصارات</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>${tests.map(p=>`<tr><td class="user">${esc(p.username)}</td><td>${Number(p.trophies||0).toLocaleString('en-US')}</td><td>${Number(p.wins||0).toLocaleString('en-US')}</td><td><span class="status approved">تجريبي</span></td><td><button class="btn red player-delete" onclick="deletePlayer('${esc(p.user_id)}')">🗑️ حذف</button></td></tr>`).join('')}</tbody></table></div></div>` : '<div class="empty" style="padding:25px">لم تنشئ لاعبين تجريبيين بعد.</div>';
}
function renderDeletePlayers(){
  const area=document.getElementById('deletePlayersArea'); if(!area)return;
  const q=(document.getElementById('deletePlayerSearch')?.value||'').trim().toLowerCase();
  const list=verifiedPlayers.filter(p=>String(p.username||'').toLowerCase().includes(q));
  area.innerHTML=list.length?`<div class="table-wrap"><table style="min-width:700px"><thead><tr><th>اللاعب</th><th>الحالة</th><th>الكؤوس</th><th>الانتصارات</th><th>إجراء</th></tr></thead><tbody>${list.map(p=>`<tr><td class="user">${esc(p.username)}</td><td><span class="status ${p.verified?'approved':'pending'}">${p.verified?'موثق':'غير موثق'}</span>${p.is_test_player?'<span style="font-size:9px;color:var(--primary-deep);margin-right:5px">🧪 تجريبي</span>':''}</td><td>${Number(p.trophies||0).toLocaleString('en-US')}</td><td>${Number(p.wins||0).toLocaleString('en-US')}</td><td><button class="btn red player-delete" onclick="deletePlayer('${esc(p.user_id)}')">🗑️ حذف</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty" style="padding:25px">لا توجد نتائج.</div>';
}
function setupPlayerDelete(){const el=document.getElementById('deletePlayerSearch');if(el)el.oninput=renderDeletePlayers;renderDeletePlayers();}
async function deletePlayer(uid){
  const p=verifiedPlayers.find(x=>String(x.user_id)===String(uid)); if(!p)return;
  const warning=p.verified?'هذا اللاعب موثق. تأكد أنك تريد حذفه فعلاً.':'سيتم حذف اللاعب غير الموثق وبياناته من الموقع.';
  if(!confirm(`⚠️ ${warning}\n\nاللاعب: ${p.username}\n\nهل تريد المتابعة؟`))return;
  const {error}=await sb.rpc('admin_delete_player',{p_user_id:uid});
  if(error){alert('تعذر حذف اللاعب: '+error.message);return;}
  alert('تم حذف اللاعب من الموقع بنجاح.');
  await loadBadgeManager();
  await loadRequests();
}

let seasonAdminSettings=null;
function toLocalInput(v){if(!v)return '';const d=new Date(v);const pad=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`}
function fromLocalInput(v){return v?new Date(v).toISOString():null}
async function loadSeasonAdmin(){
  const r=await sb.from('season_settings').select('*').eq('id',1).maybeSingle();
  if(r.error){console.warn('Season settings:',r.error.message);return;}
  seasonAdminSettings=r.data;
  if(r.data){document.getElementById('seasonNameInput').value=r.data.season_name||'';document.getElementById('seasonStartInput').value=toLocalInput(r.data.starts_at);document.getElementById('seasonEndInput').value=toLocalInput(r.data.ends_at);}
  const search=document.getElementById('seasonPlayerSearch'), select=document.getElementById('seasonPlayerSelect');
  const renderSelect=()=>{const q=(search?.value||'').trim().toLowerCase();const list=verifiedPlayers.filter(p=>String(p.username||'').toLowerCase().includes(q));select.innerHTML='<option value="">اختر اللاعب</option>'+list.map(p=>`<option value="${esc(p.user_id)}">${esc(p.username)} — ${Number(p.trophies||0).toLocaleString('en-US')} 🏆</option>`).join('')};
  if(search)search.oninput=renderSelect;renderSelect();
  select.onchange=async()=>{const uid=select.value;if(!uid)return;const r2=await sb.from('season_player_stats').select('trophies_gained,rank_gained,achievements').eq('season_id',1).eq('user_id',uid).maybeSingle();const s=r2.data||{};document.getElementById('seasonPlayerGain').value=s.trophies_gained??0;document.getElementById('seasonPlayerRank').value=s.rank_gained??0;document.getElementById('seasonPlayerAchievements').value=Array.isArray(s.achievements)?s.achievements.join(', '):''};
  document.getElementById('saveSeasonBtn').onclick=saveSeasonSettings;document.getElementById('saveSeasonPlayerBtn').onclick=saveSeasonPlayer;
}
async function saveSeasonSettings(){
  const msg=document.getElementById('seasonAdminMsg'), name=document.getElementById('seasonNameInput').value.trim()||'الموسم الحالي', st=fromLocalInput(document.getElementById('seasonStartInput').value), en=fromLocalInput(document.getElementById('seasonEndInput').value);
  if(!st||!en||new Date(en)<=new Date(st)){msg.textContent='تأكد من أن تاريخ النهاية بعد تاريخ البداية.';msg.className='notice err';msg.style.display='block';return;}
  const {error}=await sb.rpc('admin_update_season',{p_season_name:name,p_starts_at:st,p_ends_at:en});
  if(error){msg.textContent='تعذر حفظ إعدادات الموسم: '+error.message;msg.className='notice err';msg.style.display='block';return;}
  msg.textContent='تم حفظ إعدادات الموسم.';msg.className='notice info';msg.style.display='block';
}
async function saveSeasonPlayer(){
  const msg=document.getElementById('seasonPlayerMsg'),uid=document.getElementById('seasonPlayerSelect').value,gain=Number(document.getElementById('seasonPlayerGain').value||0),rank=Number(document.getElementById('seasonPlayerRank').value||0),raw=document.getElementById('seasonPlayerAchievements').value.trim();
  if(!uid){msg.textContent='اختر اللاعب أولاً.';msg.className='notice err';msg.style.display='block';return;}
  if(gain<0||rank<0){msg.textContent='الأرقام لا يمكن أن تكون سالبة.';msg.className='notice err';msg.style.display='block';return;}
  const achievements=raw?raw.split(',').map(x=>x.trim()).filter(Boolean):[];
  const {error}=await sb.rpc('admin_upsert_season_player',{p_user_id:uid,p_trophies_gained:gain,p_rank_gained:rank,p_achievements:achievements});
  if(error){msg.textContent='تعذر حفظ الإحصائيات: '+error.message;msg.className='notice err';msg.style.display='block';return;}
  msg.textContent='تم حفظ إحصائيات اللاعب لهذا الموسم.';msg.className='notice info';msg.style.display='block';
}

async function awardBadge(){
  const uid=document.getElementById('badgePlayerSelect')?.value, bid=document.getElementById('badgeSelect')?.value, msg=document.getElementById('badgeAdminMsg');
  if(!uid||!bid){msg.textContent='اختر اللاعب والشارة أولاً.';msg.className='notice err';msg.style.display='block';return;}
  const {error}=await sb.rpc('admin_award_badge',{p_user_id:uid,p_badge_id:bid});
  if(error){msg.textContent='تعذر منح الشارة: '+error.message;msg.className='notice err';msg.style.display='block';return;}
  const b=badgeDefs.find(x=>x.id===bid), pl=verifiedPlayers.find(x=>x.user_id===uid);
  msg.textContent=`تم منح ${b?.name||'الشارة'} للاعب ${pl?.username||''} وإضافة لقب ${b?.title||''} إلى ملفه.`;msg.className='notice info';msg.style.display='block';
  document.getElementById('badgePlayerSelect').value='';document.getElementById('badgeSelect').value='';
}

async function loadRequests(){
  document.getElementById('tableArea').innerHTML='<div class="loading"><h3>جارِ تحميل الطلبات...</h3></div>';
  const {data,error}=await sb.from('verification_requests').select('*').order('created_at',{ascending:false});
  if(error){document.getElementById('tableArea').innerHTML=`<div class="denied"><h3>تعذر تحميل الطلبات</h3><p>${esc(error.message)}</p><p style="margin-top:8px">تأكد من تنفيذ ملف SQL المرفق بالمشروع.</p></div>`;return;}
  requests=data||[];
  const ids=[...new Set(requests.map(r=>r.user_id).filter(Boolean))]; playersByUser={};
  if(ids.length){const {data:players}=await sb.from('players').select('user_id,username,clan,trophies,wins,best_trophies,verified').in('user_id',ids);(players||[]).forEach(p=>playersByUser[p.user_id]=p)}
  renderTable();
}
function renderTable(){
  if(!document.getElementById('tableArea'))return;
  const q=(document.getElementById('search')?.value||'').trim().toLowerCase(), f=document.getElementById('statusFilter')?.value||'all', order=document.getElementById('sortOrder')?.value||'desc';
  let list=requests.filter(r=>f==='all'||r.status===f).filter(r=>{const p=playersByUser[r.user_id]||{};return !q||(String(p.username||'')+' '+String(r.player_tag||'')+' '+String(r.social_username||'')).toLowerCase().includes(q)});
  list.sort((a,b)=>order==='desc'?new Date(b.created_at)-new Date(a.created_at):new Date(a.created_at)-new Date(b.created_at));
  document.getElementById('count').textContent=list.length;
  if(!list.length){document.getElementById('tableArea').innerHTML='<div class="empty"><div style="font-size:38px">📭</div><h3>لا توجد طلبات</h3><p>ستظهر طلبات التوثيق هنا عند إرسالها.</p></div>';return;}
  document.getElementById('tableArea').innerHTML=`<div class="table-wrap"><table><thead><tr><th>اللاعب</th><th>Player Tag</th><th>الانتصارات</th><th>تاريخ إنشاء الحساب</th><th>الحالة</th><th>تاريخ الطلب</th><th>إجراء</th></tr></thead><tbody>${list.map(r=>{const p=playersByUser[r.user_id]||{};return `<tr><td><div class="user">${esc(p.username||'غير معروف')}</div><div class="sub">${esc(r.social_username||'—')}</div></td><td dir="ltr" style="text-align:right">${esc(r.player_tag||'—')}</td><td>${Number(r.wins||0).toLocaleString('en-US')}</td><td>${esc(r.account_created_date||'—')}</td><td><span class="status ${statusClass(r.status)}">${statusLabel(r.status)}</span></td><td>${esc(fmtDate(r.created_at))}</td><td><div class="actions"><button class="btn primary" onclick="openRequest('${esc(r.id)}')">عرض ومراجعة</button></div></td></tr>`}).join('')}</tbody></table></div>`;
}
async function openRequest(id){
  selectedRequest=requests.find(r=>String(r.id)===String(id));if(!selectedRequest)return;
  const p=playersByUser[selectedRequest.user_id]||{};
  document.getElementById('modalTitle').textContent='مراجعة طلب: '+(p.username||'لاعب');
  document.getElementById('modalNotice').innerHTML='';
  let imageHtml='<div class="proof"><label style="display:block;font-size:11px;font-weight:900;margin-bottom:8px">صورة الحساب</label><div style="padding:25px;color:#6C63A6">جارِ تحميل الصورة...</div></div>';
  document.getElementById('modalDetails').innerHTML=`<div class="detail"><label>اسم اللاعب</label><div>${esc(p.username||'—')}</div></div><div class="detail"><label>User ID</label><div dir="ltr" style="text-align:right">${esc(selectedRequest.user_id||'—')}</div></div><div class="detail"><label>عدد الانتصارات</label><div>${Number(selectedRequest.wins||0).toLocaleString('en-US')}</div></div><div class="detail"><label>تاريخ إنشاء الحساب</label><div>${esc(selectedRequest.account_created_date||'—')}</div></div><div class="detail"><label>Player Tag</label><div dir="ltr" style="text-align:right">${esc(selectedRequest.player_tag||'—')}</div></div><div class="detail"><label>اليوزر الاجتماعي</label><div dir="ltr" style="text-align:right">${esc(selectedRequest.social_username||'—')}</div></div><div class="detail"><label>حالة الطلب</label><div><span class="status ${statusClass(selectedRequest.status)}">${statusLabel(selectedRequest.status)}</span></div></div><div class="detail"><label>تاريخ إرسال الطلب</label><div>${esc(fmtDate(selectedRequest.created_at))}</div></div>${imageHtml}<div class="notes"><label style="display:block;font-size:11px;font-weight:900;margin-bottom:8px">ملاحظات المشرف</label><textarea class="field" id="adminNotes" placeholder="اكتب ملاحظاتك هنا..."></textarea></div>`;
  document.getElementById('approveBtn').style.display=selectedRequest.status==='approved'?'none':'block';document.getElementById('rejectBtn').style.display=selectedRequest.status==='rejected'?'none':'block';
  document.getElementById('modalOverlay').classList.add('show');
  if(selectedRequest.proof_image_path){const {data,error}=await sb.storage.from(VERIFY_BUCKET).createSignedUrl(selectedRequest.proof_image_path,300);const proof=document.querySelector('.proof');if(error){proof.innerHTML='<label style="display:block;font-size:11px;font-weight:900;margin-bottom:8px">صورة الحساب</label><div style="padding:25px;color:#D6336C">تعذر عرض الصورة: '+esc(error.message)+'</div>'}else{proof.innerHTML='<label style="display:block;font-size:11px;font-weight:900;margin-bottom:8px">صورة الحساب</label><img src="'+esc(data.signedUrl)+'" alt="صورة التوثيق">'}}
}
async function review(status){
  if(!selectedRequest)return;
  const notes=document.getElementById('adminNotes')?.value?.trim()||null;
  const msg=status==='approved'?'هل أنت متأكد من قبول هذا الحساب وتوثيقه؟':'هل أنت متأكد من رفض طلب التوثيق؟';
  if(!confirm(msg))return;
  document.getElementById('approveBtn').disabled=true;document.getElementById('rejectBtn').disabled=true;
  const update={status,admin_notes:notes,reviewed_at:new Date().toISOString(),reviewed_by:currentUser.id};
  if(status==='rejected')update.rejection_reason=notes;
  const {error:e1}=await sb.from('verification_requests').update(update).eq('id',selectedRequest.id);
  if(e1){alert('تعذر تحديث الطلب: '+e1.message);document.getElementById('approveBtn').disabled=false;document.getElementById('rejectBtn').disabled=false;return;}
  if(status==='approved'){
    const {error:e2}=await sb.from('players').update({verified:true,verified_at:new Date().toISOString()}).eq('user_id',selectedRequest.user_id);
    if(e2){alert('تم قبول الطلب لكن تعذر تحديث حالة اللاعب: '+e2.message+'\nراجع RLS وسياسة تحديث players.');return;}
  }else{
    const {error:e3}=await sb.from('players').update({verified:false,verified_at:null}).eq('user_id',selectedRequest.user_id);
    if(e3)console.warn('Could not reset player verification:',e3);
  }
  document.getElementById('modalOverlay').classList.remove('show');await loadRequests();
}
document.getElementById('approveBtn').onclick=()=>review('approved');document.getElementById('rejectBtn').onclick=()=>review('rejected');document.getElementById('closeModal').onclick=()=>document.getElementById('modalOverlay').classList.remove('show');document.getElementById('modalOverlay').onclick=e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('show')};document.getElementById('refreshBtn').onclick=()=>loadRequests();document.getElementById('backBtn').onclick=()=>location.href='index.html';document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('modalOverlay').classList.remove('show')});load();
</script>
</body>
</html>
